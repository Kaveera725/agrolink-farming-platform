<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="grainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7B40" />
      <stop offset="100%" stop-color="#584318" />
    </linearGradient>
    <linearGradient id="goldGrain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#grainBg)" />
  <circle cx="200" cy="150" r="110" fill="#ffffff" opacity="0.05" />
  <g transform="translate(155, 60) scale(1.3)">
    <!-- Wheat / Rice Stalk -->
    <path d="M45 140 Q40 80 42 20" stroke="#FDE047" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Grains -->
    <ellipse cx="32" cy="30" rx="9" ry="5" transform="rotate(-30 32 30)" fill="url(#goldGrain)" />
    <ellipse cx="52" cy="35" rx="9" ry="5" transform="rotate(30 52 35)" fill="url(#goldGrain)" />
    <ellipse cx="30" cy="48" rx="10" ry="5.5" transform="rotate(-35 30 48)" fill="url(#goldGrain)" />
    <ellipse cx="54" cy="53" rx="10" ry="5.5" transform="rotate(35 54 53)" fill="url(#goldGrain)" />
    <ellipse cx="28" cy="68" rx="11" ry="6" transform="rotate(-35 28 68)" fill="url(#goldGrain)" />
    <ellipse cx="56" cy="73" rx="11" ry="6" transform="rotate(35 56 73)" fill="url(#goldGrain)" />
    <ellipse cx="27" cy="90" rx="11" ry="6" transform="rotate(-30 27 90)" fill="url(#goldGrain)" />
    <ellipse cx="57" cy="95" rx="11" ry="6" transform="rotate(30 57 95)" fill="url(#goldGrain)" />
    <ellipse cx="42" cy="18" rx="8" ry="4.5" transform="rotate(-10 42 18)" fill="url(#goldGrain)" />
  </g>
  <text x="200" y="240" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600" fill="#FEF08A" text-anchor="middle" letter-spacing="1">GRAINS &amp; RICE</text>
</svg>
