<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="fruitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C1703B" />
      <stop offset="100%" stop-color="#7C3A13" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A226" />
      <stop offset="100%" stop-color="#E76F51" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fruitGrad)" />
  <circle cx="200" cy="150" r="110" fill="#ffffff" opacity="0.06" />
  <g transform="translate(140, 75) scale(1.3)">
    <!-- Fruit shapes -->
    <ellipse cx="60" cy="65" rx="36" ry="34" fill="url(#orangeGrad)" />
    <!-- Leaf on fruit -->
    <path d="M60 30 C50 15, 65 5, 80 18 C70 28, 65 30, 60 30 Z" fill="#52B788" />
    <path d="M60 32 L60 20" stroke="#40916C" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="32" cy="72" rx="20" ry="24" fill="#E9C46A" opacity="0.9" />
  </g>
  <text x="200" y="240" font-family="'DM Sans', sans-serif" font-size="16" font-weight="600" fill="#FFF8E7" text-anchor="middle" letter-spacing="1">FRESH FRUITS</text>
</svg>
