{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-lg">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-leaf-pale rounded-2xl mb-4">
        <svg class="w-8 h-8 text-leaf" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <h1 class="font-display text-3xl font-bold text-gray-800">Join AgroLink</h1>
      <p class="text-gray-500 mt-1 text-sm">Create your account to start trading</p>
    </div>

    <div class="card p-8">
      <form method="POST" class="space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- Role selection -->
        <div>
          <label class="form-label">I am a</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="relative cursor-pointer">
              <input type="radio" name="role" value="farmer" class="peer sr-only" checked />
              <div class="border-2 border-gray-200 peer-checked:border-leaf peer-checked:bg-leaf-pale rounded-xl p-4 text-center transition-all">
                <div class="text-2xl mb-1">🌾</div>
                <div class="font-semibold text-sm text-gray-700 peer-checked:text-leaf">Farmer</div>
                <div class="text-xs text-gray-400">List & sell crops</div>
              </div>
            </label>
            <label class="relative cursor-pointer">
              <input type="radio" name="role" value="buyer" class="peer sr-only" />
              <div class="border-2 border-gray-200 peer-checked:border-sky peer-checked:bg-sky-pale rounded-xl p-4 text-center transition-all">
                <div class="text-2xl mb-1">🛒</div>
                <div class="font-semibold text-sm text-gray-700">Buyer</div>
                <div class="text-xs text-gray-400">Browse & order</div>
              </div>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="sm:col-span-2">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" required class="form-input" placeholder="Your full name" />
          </div>
          <div class="sm:col-span-2">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" required class="form-input" placeholder="you@example.com" />
          </div>
          <div>
            <label class="form-label">Password</label>
            <input type="password" name="password" required class="form-input" placeholder="Min 6 characters" minlength="6" />
          </div>
          <div>
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" required class="form-input" placeholder="Repeat password" />
          </div>
          <div>
            <label class="form-label">Phone <span class="text-gray-400 font-normal">(optional)</span></label>
            <input type="tel" name="phone" class="form-input" placeholder="+94 77 123 4567" />
          </div>
          <div>
            <label class="form-label">Location <span class="text-gray-400 font-normal">(optional)</span></label>
            <input type="text" name="location" class="form-input" placeholder="e.g. Kandy, Sri Lanka" />
          </div>
        </div>

        <button type="submit" class="w-full btn-primary py-3 text-base flex justify-center">
          Create Account
        </button>
      </form>
    </div>

    <p class="text-center mt-5 text-sm text-gray-500">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-leaf font-semibold hover:underline">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
