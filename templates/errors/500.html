{% extends "base.html" %}
{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-16 px-4">
  <div class="max-w-md w-full text-center">
    <div class="w-20 h-20 bg-red-100 text-red-600 rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-sm">
      <span class="text-3xl font-display font-bold">500</span>
    </div>
    <h1 class="font-display text-3xl font-bold text-gray-800 mb-3">Something Went Wrong</h1>
    <p class="text-gray-500 mb-8 leading-relaxed">
      We encountered an unexpected error processing your request. Our technical team has been notified.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="{{ url_for('main.home') }}" class="btn-primary">
        Return Home
      </a>
      <a href="javascript:location.reload()" class="btn-secondary">
        Try Again
      </a>
    </div>
  </div>
</div>
{% endblock %}
