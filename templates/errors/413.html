{% extends "base.html" %}
{% block title %}File Too Large (413){% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center py-16 px-4">
  <div class="max-w-md w-full text-center">
    <div class="w-20 h-20 bg-amber-100 text-amber-700 rounded-3xl mx-auto flex items-center justify-center mb-6 shadow-sm">
      <svg class="w-10 h-10 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
    </div>
    <h1 class="font-display text-3xl font-bold text-gray-800 mb-3">File Too Large</h1>
    <p class="text-gray-500 mb-8 leading-relaxed">
      The file you tried to upload exceeds the maximum allowed size of <strong>5 MB</strong>. Please compress or resize your image and try again.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="javascript:history.back()" class="btn-primary">
        Go Back & Try Again
      </a>
      <a href="{{ url_for('main.home') }}" class="btn-secondary">
        Return Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
